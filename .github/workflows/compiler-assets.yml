name: Publish compiler assets

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Exact releaseId from compiler-assets.lock.json
        required: true
        type: string
      confirmation:
        description: Type publish-immutable-compiler-assets
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: compiler-assets-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify explicit immutable release selection
        env:
          REQUESTED_RELEASE_ID: ${{ inputs.release_id }}
          PUBLISH_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$PUBLISH_CONFIRMATION" = publish-immutable-compiler-assets
          node -e 'const lock=require("./compiler-assets.lock.json"); if (lock.releaseId !== process.env.REQUESTED_RELEASE_ID) throw new Error(`Requested ${process.env.REQUESTED_RELEASE_ID}; lock is ${lock.releaseId}`)'

      - name: Run source and manifest tests
        run: |
          npm run typecheck
          npm test

      - name: Prepare BusyTeX assets
        run: |
          npm run busytex:assets
          npm run compiler-assets:verify

      - name: Publish immutable compiler release
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: node scripts/publish-compiler-assets.mjs

      - name: Verify the public immutable release
        run: node scripts/verify-compiler-assets.mjs --wait-seconds 120
