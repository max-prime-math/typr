name: Publish compiler assets

on:
  push:
    branches: ["dev"]
    paths:
      - ".github/workflows/compiler-assets.yml"
      - "package-lock.json"
      - "scripts/ensure-busytex-assets.cjs"
      - "scripts/publish-compiler-assets.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-assets-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare BusyTeX assets
        run: npm run busytex:assets

      - name: Publish immutable compiler release
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: node scripts/publish-compiler-assets.mjs
