worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  include /tmp/typr/resolver.conf;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $status $typr_immutable_cache_control {
    ~^(200|206|304)$ "public, max-age=31536000, immutable";
    default "no-store";
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/snippets/typr-security.conf;
    add_header Cache-Control "no-store" always;

    if ($request_method !~ ^(GET|HEAD)$) {
      return 405;
    }

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
      include /etc/nginx/snippets/typr-security.conf;
      add_header Cache-Control "no-store" always;
    }

    include /tmp/typr/compiler.conf;

    location ^~ /compiler-assets/ {
      return 404;
      include /etc/nginx/snippets/typr-security.conf;
      add_header Cache-Control "no-store" always;
    }

    location = /google-drive-oauth-callback.html {
      return 404;
      include /etc/nginx/snippets/typr-security.conf;
      add_header Cache-Control "no-store" always;
    }

    location ~ "^/assets/.+-[A-Za-z0-9_-]{8}\.(?:js|css|wasm|woff2?|ttf|otf|svg)$" {
      try_files $uri =404;
      include /etc/nginx/snippets/typr-security.conf;
      add_header Cache-Control $typr_immutable_cache_control always;
    }

    location ~ ^/(?:index\.html|sw\.js|workbox-[^/]+\.js|manifest\.webmanifest|release\.json)$ {
      try_files $uri =404;
      include /etc/nginx/snippets/typr-security.conf;
      add_header Cache-Control "no-cache" always;
    }

    location / {
      try_files $uri $uri/ =404;
      include /etc/nginx/snippets/typr-security.conf;
      add_header Cache-Control "no-cache" always;
    }
  }
}
