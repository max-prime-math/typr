services:
  typr:
    image: ${TYPR_IMAGE:-ghcr.io/max-prime-math/typr:latest}
    restart: unless-stopped
    user: "101:101"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=33554432
    pids_limit: 64
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    stop_grace_period: 10s
    ports:
      # Loopback is the safest default and is also a browser secure-context exception.
      - "${TYPR_BIND_ADDRESS:-127.0.0.1}:${TYPR_PORT:-8080}:8080"
